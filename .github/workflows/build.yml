name: Build plugin

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      - name: Host selftest
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -ffp-contract=off -Wall -Wextra -Werror \
            -fno-exceptions -fno-rtti selftest.cpp -o selftest-host -lm
          ./selftest-host | tee selftest-host.log

      - name: Host selftest with sanitizers
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -g -ffp-contract=off -Wall -Wextra -Werror \
            -fno-exceptions -fno-rtti -fno-omit-frame-pointer \
            -fsanitize=address,undefined selftest.cpp -o selftest-san -lm
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            ./selftest-san | tee selftest-san.log

      - name: Locate Android NDK
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null \
              | sort -V | tail -n 1)
          fi
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "::error::Android NDK not found"
            exit 1
          fi
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          grep '^Pkg.Revision' "$NDK/source.properties"

      - name: Microbenchmark O2 vs Os
        run: |
          set -euo pipefail
          for mode in 2 s; do
            g++ -std=c++17 -O$mode -ffp-contract=off -Wall -Wextra -Werror \
              -DFLICK_BENCH_OPT=$([ "$mode" = 2 ] && echo 2 || echo 0) \
              -fno-exceptions -fno-rtti tools/bench.cpp -o "bench-$mode" -lm
          done
          ./bench-2 | tee bench.txt
          ./bench-s | tee -a bench.txt

      - name: Cross-build selftest (arm64 + arm)
        run: |
          set -euo pipefail
          BIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          mkdir -p out-test
          for t in aarch64-linux-android24:arm64 armv7a-linux-androideabi24:arm; do
            "$BIN/${t%%:*}-clang++" -std=c++17 -O2 -ffp-contract=off \
              -Wall -Wextra -Werror -fno-exceptions -fno-rtti -nostdlib++ \
              selftest.cpp -o "out-test/selftest.${t##*:}" -lm
          done

      - name: Foreground proc scan test
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -ffp-contract=off -Wall -Wextra -Werror \
            -DFLICK_PROC_TEST -DFLICK_PROC_ROOT='"/tmp/flick-proc-test"' \
            proc_test.cpp -o proc-test
          ./proc-test | tee proc-test.log

      - name: Host control server test
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version=//p' module.prop)
          [ -n "$VERSION" ] || { echo "::error::module.prop has no version"; exit 1; }
          g++ -std=c++17 -O2 -ffp-contract=off -Wall -Wextra -Werror \
            -DFLICK_VERSION="\"$VERSION\"" ctrl_test.cpp -o ctrl-test -lm
          ./ctrl-test | tee ctrl-test.log

      - name: Host control server test with sanitizers
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version=//p' module.prop)
          [ -n "$VERSION" ] || { echo "::error::module.prop has no version"; exit 1; }
          g++ -std=c++17 -O1 -g -ffp-contract=off -Wall -Wextra -Werror \
            -fno-omit-frame-pointer -fsanitize=address,undefined \
            -DFLICK_VERSION="\"$VERSION\"" ctrl_test.cpp -o ctrl-test-san -lm
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            ./ctrl-test-san | tee ctrl-test-san.log

      - name: Shell syntax and shellcheck
        run: |
          set -euo pipefail
          for f in *.sh; do sh -n "$f"; done
          shellcheck -s sh -S warning ctl.sh customize.sh hw.sh notify.sh uninstall.sh

      - name: WebUI JavaScript syntax
        run: python3 tools/check_webui.py index.html

      - uses: actions/upload-artifact@v4
        with:
          name: Selftest
          path: |
            out-test/selftest.*
            selftest-host.log
            selftest-san.log
            proc-test.log
            ctrl-test.log
            ctrl-test-san.log
            bench.txt

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          # The reproducible timestamp needs the real last-change commit for module.prop. A shallow
          # checkout makes git log treat HEAD as that commit.
          fetch-depth: 0

      - name: Locate Android NDK
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null \
              | sort -V | tail -n 1)
          fi
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "::error::Android NDK not found"
            exit 1
          fi
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          grep '^Pkg.Revision' "$NDK/source.properties"

      - name: Compile (arm64 + arm)
        run: |
          set -euo pipefail
          BIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          VERSION=$(sed -n 's/^version=//p' module.prop)
          [ -n "$VERSION" ] || { echo "::error::module.prop has no version"; exit 1; }
          mkdir -p out/system/bin metrics
          COMMON=(
            -std=c++17 -Os -DNDEBUG -D_FORTIFY_SOURCE=2
            -DFLICK_VERSION="\"$VERSION\""
            -ffp-contract=off -fno-exceptions -fno-rtti -fvisibility=hidden
            -fstack-protector-strong -fno-unwind-tables -fno-asynchronous-unwind-tables
            -ffunction-sections -fdata-sections -ffile-prefix-map="$PWD"=.
            -Wall -Wextra -Werror -Wformat=2 -Wshadow -Wundef -Wcast-align -Wpointer-arith
            -pie -nostdlib++
            -Wl,--gc-sections -Wl,--as-needed -Wl,--build-id=none
            -Wl,-z,relro -Wl,-z,now -Wl,-z,noexecstack -Wl,-z,max-page-size=16384
          )
          printf '%s\n' "${COMMON[*]}" > metrics/flags.txt
          for t in aarch64-linux-android24:arm64 armv7a-linux-androideabi24:arm; do
            "$BIN/${t%%:*}-clang++" "${COMMON[@]}" flick.cpp \
              -o "out/system/bin/flick.${t##*:}" -lm
          done
          "$BIN/llvm-size" out/system/bin/flick.* | tee metrics/size-unstripped.txt
          "$BIN/llvm-strip" --strip-all out/system/bin/flick.*
          "$BIN/llvm-size" out/system/bin/flick.* | tee metrics/size-stripped.txt
          ls -l out/system/bin | tee -a metrics/size-stripped.txt

      - name: Verify ELF
        run: |
          set -euo pipefail
          READELF=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          for f in out/system/bin/flick.arm64 out/system/bin/flick.arm; do
            echo "== $f"
            "$READELF" -d "$f" | grep -E 'NEEDED|RPATH|RUNPATH|TEXTREL|BIND_NOW' || true
            "$READELF" -lW "$f" | grep -E 'LOAD|GNU_RELRO|GNU_STACK' || true

            # grep without -q consumes the whole stream: with pipefail, -q closes the pipe early and
            # llvm-readelf can exit 74 on the resulting EPIPE.
            case $f in
              *.arm64)
                "$READELF" -h "$f" | grep 'Class:.*ELF64' >/dev/null
                "$READELF" -h "$f" | grep 'Machine:.*AArch64' >/dev/null
                ;;
              *.arm)
                "$READELF" -h "$f" | grep 'Class:.*ELF32' >/dev/null
                "$READELF" -h "$f" | grep 'Machine:.*ARM' >/dev/null
                ;;
            esac
            "$READELF" -h "$f" | grep 'Type:.*DYN' >/dev/null || { echo "::error::$f is not PIE"; exit 1; }
            "$READELF" -d "$f" | grep 'BIND_NOW' >/dev/null || { echo "::error::$f is not BIND_NOW"; exit 1; }
            "$READELF" -d "$f" | grep 'TEXTREL' >/dev/null && { echo "::error::$f has TEXTREL"; exit 1; } || true
            "$READELF" -d "$f" | grep -E 'RPATH|RUNPATH' >/dev/null && { echo "::error::$f has RPATH/RUNPATH"; exit 1; } || true
            "$READELF" -lW "$f" | grep 'GNU_RELRO' >/dev/null || { echo "::error::$f is not RELRO"; exit 1; }
            "$READELF" -lW "$f" | grep 'GNU_STACK' >/dev/null || { echo "::error::$f has no GNU_STACK"; exit 1; }
            ! "$READELF" -lW "$f" | grep 'GNU_STACK.*RWE' >/dev/null || { echo "::error::$f has an executable stack"; exit 1; }
            ALIGN=$("$READELF" -lW "$f" | awk '$1 == "LOAD" && !a { a=$NF } END { print a }')
            [ -n "$ALIGN" ] || { echo "::error::$f has no LOAD segment"; exit 1; }
            [ $((ALIGN)) -ge 16384 ] || { echo "::error::$f LOAD alignment $ALIGN < 16 KB"; exit 1; }

            BAD=$("$READELF" -d "$f" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' \
              | grep -vE '^(libc|libm|libdl)\.so$' || true)
            [ -z "$BAD" ] || { echo "::error::$f depends on unexpected libraries: $BAD"; exit 1; }
          done

      - name: Validate module.prop
        run: |
          set -euo pipefail
          grep -qE '^id=[a-zA-Z][a-zA-Z0-9._-]+$' module.prop
          grep -qE '^versionCode=[0-9]+$' module.prop
          grep -qE '^axeronPlugin=[0-9]+$' module.prop
          grep -qE '^version=v[0-9]+\.[0-9]+\.[0-9]+$' module.prop

      - name: Set reproducible timestamp
        run: |
          # Tie the zip timestamp to the last module.prop change. The packaged files do not depend on
          # documentation or CI commits, so those commits must not change the artifact hash.
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct -- module.prop)" >> "$GITHUB_ENV"

      - name: Stage module
        run: |
          set -euo pipefail
          mkdir -p stage/system/bin stage/webroot
          cp module.prop customize.sh uninstall.sh hw.sh ctl.sh notify.sh stage/
          cp index.html stage/webroot/
          cp out/system/bin/flick.arm out/system/bin/flick.arm64 stage/system/bin/
          sed -i 's/\r$//' stage/module.prop stage/*.sh stage/webroot/index.html
          chmod 755 stage/*.sh stage/system/bin/flick.*
          for f in stage/*.sh; do sh -n "$f"; done
          find stage -type f -printf '%m %s %p\n' | sort

      - name: Package (deterministic, twice)
        run: |
          set -euo pipefail
          python3 tools/package.py --root stage --out dist
          python3 tools/package.py --root stage --out dist-repro
          cmp dist/Flick-*.zip dist-repro/Flick-*.zip
          (cd dist && sha256sum -c Flick-*.zip.sha256)
          unzip -l dist/Flick-*.zip
          cp out/system/bin/flick.arm64 dist/flick-arm64
          cp out/system/bin/flick.arm dist/flick-arm
          (cd dist && sha256sum flick-arm64 > flick-arm64.sha256)
          (cd dist && sha256sum flick-arm > flick-arm.sha256)
          (cd dist && sha256sum -c flick-arm64.sha256 flick-arm.sha256)

      - name: Build info
        run: |
          set -euo pipefail
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "ref=$GITHUB_REF"
            echo "run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "ndk=$(grep '^Pkg.Revision' "$NDK/source.properties" | cut -d= -f2 | tr -d ' ')"
            echo "flags=$(cat metrics/flags.txt)"
            echo "package=$(basename dist/Flick-*.zip)"
            echo "package_sha256=$(cut -d' ' -f1 dist/Flick-*.zip.sha256)"
            echo "arm64_bytes=$(stat -c %s stage/system/bin/flick.arm64)"
            echo "arm_bytes=$(stat -c %s stage/system/bin/flick.arm)"
          } | tee dist/build-info.txt
          cp metrics/*.txt dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Flick
          path: |
            dist/Flick-*.zip
            dist/Flick-*.zip.sha256
            dist/Flick-*.manifest.txt
            dist/flick-arm64
            dist/flick-arm
            dist/flick-arm64.sha256
            dist/flick-arm.sha256
            dist/build-info.txt
            dist/*.txt

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Flick
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/Flick-*.zip
            dist/Flick-*.zip.sha256
            dist/Flick-*.manifest.txt
            dist/flick-arm64
            dist/flick-arm
            dist/flick-arm64.sha256
            dist/flick-arm.sha256
